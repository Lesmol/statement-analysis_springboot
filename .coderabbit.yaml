# yaml-language-server: $schema=https://coderabbit.ai/export/schema.json
language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false

  path_filters:
    - "!target/**"
    - "!*.pdf"

chat:
  auto_reply: true

path_instructions:
  - path: "**/*.java"
    instructions: |
      - Ensure Spring Boot @RestController methods properly handle exceptions via global @ControllerAdvice rather than local try-catch blocks.
      - Validate that AWS SDK v2 calls use asynchronous patterns where applicable and handle network exceptions correctly.
