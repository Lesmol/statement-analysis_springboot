spring:
  application:
    name: statement-analysis_springboot
aws:
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID}
    client-id: ${COGNITO_CLIENT_ID}
    client-secret: ${COGNITO_CLIENT_SECRET}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
  sns:
    topic: ${AWS_SNS_TOPIC}
    role: ${AWS_SNS_ROLE}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  structured:
    format:
      console: ecs